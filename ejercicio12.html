<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 12</title>
</head>
<body>
    <script>
        let numero = parseInt(prompt("Ingrese numero: "));

        if (numero % 2 == 0) {
            document.write(`El numero es par`);
        } else {
            document.write(`El numero es impar`);
        }
    </script>
</body>
</html>
