<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 10</title>
</head>
<body>
    <script>
        let cantidad = parseInt(prompt("Cuantos numeros desea ingresar?"));
        let numeros = [];

        for (let i = 0; i < cantidad; i++) {
            let num = parseInt(prompt(`Ingrese el numero ${i + 1}:`));
            numeros.push(num);
        }

        document.write(`Numeros ingresados: ${numeros.join(", ")} <br>`);

        let suma = 0;
        for (let n of numeros) {
            suma += n;
        }

        let promedio = suma / numeros.length;

        document.write(`Promedio: ${promedio}`);
    </script>
</body>
</html>
