<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 17</title>
</head>
<body>
    <script>
        const contarLetraA = (string) => {
            let contador = 0;

            for (let i = 0; i < string.length; i++) {
                if (string[i] == "a" || string[i] == "A") {
                    contador++;
                }
            }

            return contador;
        };

        let texto = prompt("Ingrese una palabra :");

        document.write(`Cantidad de letras A: ${contarLetraA(texto)}`);
    </script>
</body>
</html>
