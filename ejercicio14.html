<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 14</title>
</head>
<body>
    <script>
        let cantidad = parseInt(prompt(`Ingrese cantidad de numeros a agregar: `));
        let array = [];
        let faltantes = cantidad;

        for (let i = 0; i < cantidad; i++) {
            array.push(parseInt(prompt(`Ingrese numero:\nCantidad faltante: ${faltantes}`)));
            faltantes--;
        }

        let duplicados = [];
        const duplicar = (array) => {
            array.forEach(numero => {
                duplicados.push(numero * 2);
            });
        };

        duplicar(array);

        duplicados.forEach(numero => {
            document.write(`${numero}<br>`);
        });
    </script>
</body>
</html>
