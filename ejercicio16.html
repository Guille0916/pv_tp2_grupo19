<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 16</title>
</head>
<body>
    <script>
        const sumarRango = (a, b) => {
            let resultado = 0;

            for (let i = a; i <= b; i++) {
                resultado += i;
            }

            return resultado;
        };

        document.write(`La suma del rango es: ${sumarRango(2, 8)}`);
    </script>
</body>
</html>
